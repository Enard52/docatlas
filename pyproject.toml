[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docatlas"
version = "1.0.0"
description = "Evidence-first documentation search, grounded answers, and retrieval evaluation."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "numpy>=2,<3", "pypdf>=5,<7", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.6,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
docatlas = "docatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docatlas = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
